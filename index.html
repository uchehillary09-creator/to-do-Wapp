<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Plan for today</p>
        <h1>Task-List</h1>
      </div>
      <span id="summary" class="summary-pill" aria-live="polite"></span>
    </header>

    <label class="search-wrap" for="search-input">
      <span class="sr-only">Search tasks</span>
      <input id="search-input" type="search" placeholder="Search tasks..." autocomplete="off">
    </label>

    <form id="add-form" class="task-form">
      <label class="field task-field">
        <span class="sr-only">Task</span>
        <input id="task-input" type="text" placeholder="Add a task..." maxlength="120" autocomplete="off" aria-label="New task" required>
      </label>

      <label class="field date-field">
        <span class="sr-only">Due date</span>
        <input id="due-date" type="date" aria-label="Due date">
      </label>

      <label class="field priority-field">
        <span class="sr-only">Priority</span>
        <select id="priority" class="priority-select" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>

      <button type="submit" class="primary-action">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
      <button class="filter-btn" data-filter="done" aria-pressed="false">Done</button>
      <button id="clear-done" class="ghost" type="button">Clear done</button>
    </div>

    <ul id="list" aria-live="polite"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
